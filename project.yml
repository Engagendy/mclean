name: MClean
options:
  bundleIdPrefix: com.engagendy
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    DEVELOPMENT_TEAM: ""
targets:
  MClean:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: MClean/MClean
    info:
      path: MClean/Resources/Info.plist
    entitlements:
      path: MClean/Resources/MClean.entitlements
    settings:
      base:
        PRODUCT_NAME: theMClean
        PRODUCT_BUNDLE_IDENTIFIER: com.engagendy.MClean
        MARKETING_VERSION: 1.0.11
        CURRENT_PROJECT_VERSION: 111
        GENERATE_INFOPLIST_FILE: "NO"
        INFOPLIST_FILE: MClean/Resources/Info.plist
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGNING_ALLOWED: "NO"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
